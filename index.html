    L2.push('جدول الشهور (أقساطه بعد خصم اللي الناس بتدفعه + الثابت = الإجمالي):');
    fc.months.forEach(function (m) { if (m.items.length) L2.push(m.key + ': ' + m.mine + ' + ' + m.fixed + ' = ' + m.total); });
    var lastM = fc.months.filter(function (m) { return m.out > 0; }).pop();
    if (lastM) L2.push('آخر شهر فيه أقساط: ' + lastM.key + '.');
    if (a.income) {
      L2.push('رأي المستشار المحسوب: الأقساط ' + a.dti + '% من الدخل، الادخار المقترح ' + a.save + ' (' + a.rate + '%)، متاح للصرف ' + a.available + '، صندوق طوارئ مبدئي ' + a.efStarter + ' وكامل ' + a.efTarget + '.');
      L2.push('اقتراح تقسيم المتاح: ' + a.cats.map(function (c) { return c.name + ' ' + c.suggest + (c.budget ? ' (خطته ' + c.budget + ')' : ''); }).join('، '));
      if (a.snowball && a.snowball.monthsSaved) L2.push('كرة التلج: لو فلوس الأقساط اللي بتخلص راحت على اللي بعدها، كله يخلص ' + a.snowball.snowEnd + ' بدل ' + a.snowball.baseEnd + '.');
    }
    var m0 = Fin.month(d, T.slice(0, 7), 'AED');
    L2.push('الشهر ده: دخل ' + m0.income + '، صرف ' + m0.spent + ' (' + m0.cats.map(function (c) { return Fin.catName(d, c.id) + ' ' + c.amount; }).join('، ') + ').');
    Fin.months(d, 4, 'AED', T).slice(0, 3).forEach(function (m) { if (m.spent || m.income) L2.push(m.key + ': دخل ' + m.income + '، صرف ' + m.spent); });
    return L2.join('\n');
  }
  function findPlan(q) {
    var d = db(), n = String(q || '').toLowerCase().trim();
    var plans = Fin.list(d.plans).filter(function (x) { return !x.archived && x.kind !== 'others' && d.providers[x.providerId]; });
    var hit = plans.filter(function (x) { return String(x.title).toLowerCase().indexOf(n) >= 0 || n.indexOf(String(x.title).toLowerCase()) >= 0; });
    if (!hit.length) hit = plans.filter(function (x) { var pn = String(d.providers[x.providerId].name).toLowerCase(); return pn.indexOf(n) >= 0 || n.indexOf(pn.split(' ')[0]) >= 0; });
    hit = hit.filter(function (x) { return Fin.schedule(x, planPaidOf(x.id), Fin.todayDate()).state !== 'done'; });
    if (hit.length > 1) { var self = hit.filter(function (x) { return x.kind !== 'epp'; }); if (self.length) hit = self; }
    hit.sort(function (x, y) { return (y.total || 0) - (x.total || 0); });
    return hit[0] || null;
  }
  function runTool(fc) {
    var a = fc.args || {};
    if (fc.name === 'purchase_check') return Fin.purchase(db(), today(), Number(a.price) || 0, Math.round(Number(a.months) || 0), !!a.essential);
    var p = findPlan(a.plan);
    if (!p) return { error: 'مفيش قسط شغال بالاسم ده', available: Fin.list(db().plans).filter(function (x) { return x.kind !== 'others'; }).map(function (x) { return x.title + ' (' + (db().providers[x.providerId] || {}).name + ')'; }) };
    if (fc.name === 'what_if_extra_payment') return Fin.whatIf(db(), p.id, Number(a.amount) || 0, 0, today());
    if (fc.name === 'what_if_resplit') return Fin.whatIf(db(), p.id, 0, Math.max(1, Math.round(Number(a.months) || 1)), today());
    return { error: 'unknown tool' };
  }
  function md(t) {
    return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n').map(function (l) {
      return /^\s*[-*•]\s+/.test(l) ? '<li>' + l.replace(/^\s*[-*•]\s+/, '') + '</li>' : l ? '<p>' + l + '</p>' : '';
    }).join('').replace(/(<li>.*?<\/li>)+/g, function (m) { return '<ul>' + m + '</ul>'; });
  }
  var SUGG = ['كل قسط هيخلص إمتى؟', 'لو دفعت 1000 زيادة على Tabby يخلص إمتى؟', 'أحوّش كام الشهر ده؟', 'أصرف كام على الأكل؟', 'لو عايز أشتري موبايل بـ 3000؟'];
  function chatHTML() {
    return '<div class="chat"><div class="msgs" id="msgs">' + (chat.log.length ? chat.log.map(function (m) {
      return '<div class="msg ' + m.who + '">' + (m.who === 'ai' ? md(m.text) : m.who === 'err' ? '<p>' + esc(m.text) + '</p>' : (m.voice ? '🎤 ' : '') + esc(m.text)) + '</div>';
    }).join('') : '<div class="msg ai"><p>أهلاً 👋 أنا المستشار. أنا شايف أرقامك كلها: الأقساط والكروت والادخار والمصاريف. اسألني أي حاجة.</p></div>') +
      (chat.busy ? '<div class="msg ai typing"><i></i><i></i><i></i></div>' : '') + '</div>' +
      (chat.log.length ? '' : '<div class="sugg">' + SUGG.map(function (q) { return '<button type="button" data-q="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div>') +
      (chat.rec ? '<div class="chat-in rec" id="recBar"><button type="button" class="ci-btn ghost" data-act="rec-cancel" aria-label="إلغاء">✕</button><div class="rec-t"><i></i><b id="recTime">0:00</b> بيسجّل…</div><button type="button" class="ci-btn" data-act="rec-send" aria-label="إرسال">↑</button></div>'
        : '<form class="chat-in" id="chatForm"><textarea id="chatQ" rows="1" enterkeyhint="enter" autocomplete="off" placeholder="اسأل أي حاجة عن فلوسك…"' + (chat.busy ? ' disabled' : '') + '>' + esc(chat.draft) + '</textarea>' +
          (CAN_REC ? '<button type="button" class="ci-btn ghost" data-act="rec-start" aria-label="رسالة صوتية"' + (chat.busy ? ' disabled' : '') + '>' + MIC + '</button>' : '') +
          '<button type="submit" class="ci-btn" aria-label="إرسال"' + (chat.busy ? ' disabled' : '') + '>↑</button></form>') +
      '<p class="muted small priv">بيتبعت لـ Google Gemini: الأرقام وأسماء الكروت والأقساط والرسايل الصوتية بس. ' + (chat.log.length ? '<button class="link" data-act="chat-clear">محادثة جديدة</button>' : '') + '</p></div>';
  }
  function keyHTML(msg) {
    return '<div class="keybox"><p><b>المستشار بيشتغل بـ Google Gemini (مجاني).</b> محتاج تربطه مرة واحدة:</p><ol>' +
      '<li>افتح <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> وادخل بأي أكونت جوجل.</li>' +
      '<li>دوس <b>Create API key</b> وانسخ المفتاح.</li><li>الصقه هنا ودوس حفظ.</li></ol>' +
      '<div class="field"><input id="aiKey" dir="ltr" placeholder="الصق المفتاح هنا" autocomplete="off"></div><p class="err" id="keyErr">' + esc(msg || '') + '</p>' +
      '<button class="btn" data-act="save-key">حفظ</button>' +
      '<p class="muted small">المفتاح بيتحفظ على السيرفر بتاعك بس (Apps Script)، ومش بيتخزن على الموبايل ولا على GitHub.</p></div>';
  }
  function openChat(forceKey) {
    if (Store.demo()) { openSheet('المستشار', '<div class="keybox"><p>في النسخة التجريبية المستشار مش متوصل بـ Gemini. في نسختك الحقيقية هتقدر تسأله زي:</p><ul>' + SUGG.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul></div>'); return; }
    if (forceKey || chat.hasKey === false) { openSheet('المستشار', keyHTML()); return; }
    if (chat.hasKey === null) {
      openSheet('المستشار', '<p class="muted">لحظة…</p>');
      Store.aiStatus().then(function (r) { chat.hasKey = !!(r && r.hasKey); openChat(); }).catch(function () { openSheet('المستشار', '<p class="err">مفيش اتصال بالسيرفر.</p>'); });
      return;
    }
    drawChat();
  }
  function drawChat() {
    openSheet('المستشار', chatHTML(), function (body) {
      body.classList.add('chat-body');
      var form = $('#chatForm', body), ta = $('#chatQ', body);
      if (form) {
        var grow = function () { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 140) + 'px'; };
        form.addEventListener('submit', function (e) { e.preventDefault(); var q = ta.value.trim(); if (q) { chat.draft = ''; askAI(q); } });
        ta.addEventListener('input', function () { chat.draft = ta.value; grow(); });
        // Enter = سطر جديد؛ الإرسال بالزرار (أو Cmd/Ctrl+Enter من الكيبورد)
        ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit')); } });
        if (chat.draft) grow();
      }
      $$('[data-q]', body).forEach(function (b) { b.addEventListener('click', function () { askAI(b.dataset.q); }); });
      var m = $('#msgs', body); m.scrollTop = m.scrollHeight;
      if (!chat.busy && !chat.rec && !('ontouchstart' in window)) setTimeout(function () { var i = $('#chatQ'); if (i) i.focus(); }, 50);
    });
  }
  function saveKey() {
    var k = ($('#aiKey') || {}).value || '';
    if (!/^[\w.-]{20,}$/.test(k.trim())) { $('#keyErr').textContent = 'المفتاح ده مش شكله صح.'; return; }
    Store.setKey(k.trim()).then(function (r) {
      if (!r || !r.ok) { $('#keyErr').textContent = 'متحفظش. جرب تاني.'; return; }
      chat.hasKey = true; toast('اتربط المستشار ✓'); drawChat();
    }).catch(function () { $('#keyErr').textContent = 'مفيش اتصال.'; });
  }
  /* رسالة صوتية: بتتسجل على الموبايل وبتتبعت لـ Gemini يسمعها ويرد */
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function recStart() {
    if (chat.busy || chat.rec) return;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].filter(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0];
      var rec = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 32000 } : undefined);
      var r = { rec: rec, stream: stream, chunks: [], t0: performance.now(), send: false };
      rec.ondataavailable = function (e) { if (e.data && e.data.size) r.chunks.push(e.data); };
      rec.onstop = function () { stream.getTracks().forEach(function (t) { t.stop(); }); if (r.send) recSend(r); };
      rec.start(1000);
      r.timer = setInterval(function () {
        var s = (performance.now() - r.t0) / 1000, el = $('#recTime');
        if (!el) { recStop(false); return; } // الشات اتقفل
        el.textContent = mmss(s);
        if (s >= 60) recStop(true);
      }, 250);
      chat.rec = r; drawChat();
    }).catch(function () { toast('اسمح للتطبيق يستخدم المايك وجرب تاني'); });
  }
  function recStop(send) {
    var r = chat.rec; if (!r) return;
    chat.rec = null; clearInterval(r.timer);
    r.secs = (performance.now() - r.t0) / 1000;
    r.send = send && r.secs >= 1;
    if (send && !r.send) toast('التسجيل قصير أوي');
    try { r.rec.stop(); } catch (e) { r.stream.getTracks().forEach(function (t) { t.stop(); }); }
    if ($('#recBar')) drawChat();
  }
  function recSend(r) {
    if (chat.busy) return;
    var blob = new Blob(r.chunks, { type: r.rec.mimeType || 'audio/mp4' });
    var me = { who: 'me', voice: true, text: 'رسالة صوتية · ' + mmss(r.secs) };
    chat.log.push(me); chat.busy = true; drawChat();
    var fr = new FileReader();
    fr.onload = function () {
      // خطوة 1: الصوت يتحول لكلام مكتوب (موديل سريع). خطوة 2: الكلام ده يتسأل للمستشار كأنه مكتوب
      var body = { contents: [{ role: 'user', parts: [{ inlineData: { mimeType: (blob.type || 'audio/mp4').split(';')[0], data: String(fr.result).split(',')[1] } },
        { text: 'اكتب الكلام اللي في التسجيل ده بالحرف زي ما اتقال (غالباً بالمصري، وممكن فيه كلام إنجليزي زي Tabby أو ENBD)، والأرقام بالأرقام. اكتب الكلام بس من غير أي حاجة تانية. لو مفيش كلام مفهوم اكتب: ؟' }] }],
        generationConfig: { temperature: 0, maxOutputTokens: 1024 } };
      Store.ai(body, true).then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || 'ai_error');
        var t = ((res.content && res.content.parts) || []).filter(function (x) { return x.text && !x.thought; }).map(function (x) { return x.text; }).join(' ').replace(/^[«"\s]+|[»"\s]+$/g, '');
        if (!t || /^[؟?.\s]*$/.test(t)) throw new Error('unclear');
        me.text = t; chat.busy = false; askAI('🎤 ' + t, me);
      }).catch(function (e) { chat.busy = false; aiFail(e.message); if (!$('#sheet').hidden && $('#chatForm')) drawChat(); });
    };
    fr.readAsDataURL(blob);
  }
  function aiFail(m) {
    if (m === 'no_key' || m === 'bad_key') { chat.hasKey = false; openSheet('المستشار', keyHTML(m === 'bad_key' ? 'المفتاح مش شغال. اعمل واحد جديد.' : '')); return; }
    chat.log.push({ who: 'err', text: m === 'ai_busy' ? 'المستشار عليه ضغط دلوقتي (الحد المجاني). جرب كمان دقيقة.' : m === 'too_big' ? 'الرسالة الصوتية طويلة. سجّل أقصر.' : m === 'unclear' ? 'مش سامع كويس. جرب تسجّل تاني.' : 'حصلت مشكلة في الاتصال بالمستشار. جرب تاني.' });
  }
  function askAI(q, me) {
    if (chat.busy) return;
    var start = chat.contents.length;
    if (!me) chat.log.push({ who: 'me', text: q });
    chat.contents.push({ role: 'user', parts: [{ text: q }] });
    chat.busy = true; drawChat();
    var rounds = 0;
    var step = function () {
      var body = { systemInstruction: { parts: [{ text: SYS + '\n\n— بيانات المستخدم —\n' + aiContext() }] }, contents: chat.contents, tools: AI_TOOLS, generationConfig: { temperature: 0.3, maxOutputTokens: 4096 } };
      return Store.ai(body).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || 'ai_error');
        var c = r.content;
        if (!c || !c.parts || !c.parts.length) throw new Error('empty');
        chat.contents.push(c);
        var calls = c.parts.filter(function (x) { return x.functionCall; });
        if (calls.length && rounds++ < 4) {
          chat.contents.push({ role: 'user', parts: calls.map(function (x) { return { functionResponse: { id: x.functionCall.id, name: x.functionCall.name, response: { result: runTool(x.functionCall) } } }; }) });
          return step();
        }
        var text = c.parts.filter(function (x) { return x.text && !x.thought; }).map(function (x) { return x.text; }).join('\n').trim();
        chat.log.push({ who: 'ai', text: text || 'مش قادر أجاوب على ده دلوقتي. جرب تسأل بطريقة تانية.' });
      });
    };
    step().catch(function (e) {
      chat.contents.length = start;
      chat.busy = false; aiFail(e.message);
    }).then(function () { chat.busy = false; if (!$('#sheet').hidden && $('#chatForm')) drawChat(); });
  }

  /* =================== الأحداث =================== */
  document.addEventListener('click', function (e) {
    var k = e.target.closest('[data-pin]');
    if (k) { pinKey(k.dataset.pin); return; }
    var t = e.target.closest('button, [data-act]');
    if (!t || t.disabled) return;
    if (t.closest('#frm') && !t.dataset.act) return;
    var act = t.dataset.act, id = t.dataset.id;
    if (t.dataset.tab) { ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.go) { ui.tab = t.dataset.go; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.cur) { ui.cur = t.dataset.cur; render(); return; }
    if (t.dataset.fc) { ui.fcOpen = ui.fcOpen === t.dataset.fc ? null : t.dataset.fc; render(); return; }
    if (t.dataset.toggle) { ui.open[t.dataset.toggle] = t.getAttribute('aria-expanded') !== 'true'; render(); return; }
    switch (act) {
      case 'add': newTx('expense'); break;
      case 'ag-all': ui.agAll = !ui.agAll; render(); break;
      case 'fixed': fixedView(); break;
      case 'new-fixed': fixedForm(); break;
      case 'income': (function () { var f = L('fixed').filter(function (x) { return x.kind === 'income' && !x.archived; })[0]; fixedForm(f, 'income'); })(); break;
      case 'buy': buyForm(); break;
      case 'chat': openChat(); break;
      case 'save-key': saveKey(); break;
      case 'rec-start': recStart(); break;
      case 'rec-cancel': recStop(false); break;
      case 'rec-send': recStop(true); break;
      case 'ai-settings': chat.hasKey = null; openChat(true); break;
      case 'chat-clear': chat.contents = []; chat.log = []; openChat(); break;
      case 'apply-sugg': Fin.advise(db(), today()).cats.forEach(function (c) { if (!c.budget && c.suggest > 0) Store.upsert('categories', Object.assign({}, db().categories[c.id], { budget: c.suggest })); }); toast('اتحفظت كخطتك ✓ تقدر تغيّر أي بند'); render(); break;
      case 'edit-fixed': fixedForm(db().fixed[id]); break;
      case 'close': closeSheet(); break;
      case 'mprev': ui.month = Fin.prevKey(ui.month); render(); break;
      case 'mnext': ui.month = Fin.iso(Fin.addMonths(Fin.parse(ui.month + '-01'), 1, 1)).slice(0, 7); render(); break;
      case 'edit-tx': closeSheet(); editTx(id); break;
      case 'pay-plan': payPlan(id); break;
      case 'edit-plan': planForm(null, db().plans[id]); break;
      case 'new-plan': planForm(id); break;
      case 'card-pay': cardPay(id); break;
      case 'new-provider': providerForm(); break;
      case 'edit-provider': providerForm(db().providers[id]); break;
      case 'account': accountView(id); break;
      case 'edit-account': accountForm(db().accounts[id]); break;
      case 'new-account': accountForm(); break;
      case 'reconcile': reconcileForm(id); break;
      case 'new-transfer': newTx('transfer'); break;
      case 'new-recv': recvForm(); break;
      case 'edit-recv': recvForm(db().receivables[id]); break;
      case 'recv': recvPay(id); break;
      case 'cats': catsView(); break;
      case 'edit-cat': catForm(db().categories[id]); break;
      case 'new-cat': catForm(null, t.dataset.kind); break;
      case 'settings': settingsView(); break;
      case 'sync-now': Store.sync().then(function () { toast(Store.status().online ? 'اتزامن ✓' : 'مفيش اتصال'); }); closeSheet(); break;
      case 'change-pin': changePinForm(); break;
      case 'export': exportData(); break;
      case 'lock': lockNow(); break;
      case 'forget':
        if (t.dataset.sure) { Store.forget(); location.reload(); } else { t.dataset.sure = '1'; t.querySelector('b').textContent = 'متأكد؟ دوس تاني'; }
        break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!$('#lock').hidden) { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); return; }
    if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  });
  $('#sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeSheet(); });
  Store.on(function (what) { if (what === 'sync') drawSync(); else if (what === 'data') { if ($('#sheet').hidden) render(); } else if (what === 'pin_changed') { Store.forget(); showLock('login', 'الرقم السري اتغير من جهاز تاني. ادخل الجديد.'); } });
  // قفل تلقائي بعد دقيقتين في الخلفية
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { lockTimer = setTimeout(function () { if (!$('#app').hidden) lockNow(); }, 120000); }
    else { clearTimeout(lockTimer); if (!$('#app').hidden) Store.sync(); }
  });
  window.addEventListener('online', function () { if (!$('#app').hidden) Store.flush(); });

  /* =================== البداية =================== */
  $('#keypad').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(function (k) {
    return k ? '<button type="button" data-pin="' + k + '"' + (k === 'del' ? ' aria-label="امسح">⌫' : '>' + k) + '</button>' : '<span></span>';
  }).join('');
  if (!window.crypto || !crypto.subtle) { $('#lockErr').textContent = 'المتصفح ده مش بيدعم التشفير. افتح التطبيق من Safari أو Chrome.'; return; }
  Store.init({ api: API, demoData: Demo.data }).then(function (mode) { showLock(mode); })
    .catch(function (e) {
      showLock('unlock'); $('#keypad').hidden = true; $('#lockTitle').textContent = 'مش قادر أوصل للسيرفر';
      $('#lockHint').innerHTML = esc(errText(e)) + '<br><button class="btn soft" type="button" onclick="location.reload()">حاول تاني</button>';
    });
})();

</script>

if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
