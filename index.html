<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساباتي</title>
<meta name="description" content="اللي عليا، واللي معايا، ومصاريفي">
<meta name="theme-color" content="#0a0e13">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حساباتي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Lato:wght@400;700&family=Anek+Latin:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 560px), sticky top bar, bottom tab bar, floating + button, bottom-sheet forms.
   Deliberately dark: a private-banking look where red = owed, green = held, gold = gold. */
:root {
  --bg: #0a0e13;
  --surface: #121821;
  --surface-2: #19212c;
  --line: #232d3a;
  --track: #222b37;
  --fg: #eef2f6;
  --muted: #8a97a8;
  --red: #ff5d5d;   --red-soft: rgba(255, 93, 93, .12);
  --green: #31d08a; --green-soft: rgba(49, 208, 138, .12);
  --gold: #e3b54a;  --gold-soft: rgba(227, 181, 74, .12);
  --amber: #ffb547; --amber-soft: rgba(255, 181, 71, .13);
  --blue: #5aa7ff;  --blue-soft: rgba(90, 167, 255, .13);
  --font: "Lato", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-head: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-num: "Anek Latin", "Lato", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
svg { flex: none; }
h1, h2, h3, h4, .brand, .app-name, .prov-t b, .plan-t b, .hello, .monthnav b, .tile span, .kv span, .trio span { font-family: var(--font-head); }
h1, h2, h3, h4 { font-weight: 700; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.red { color: var(--red); } .green { color: var(--green); } .gold { color: var(--gold); }
.muted { color: var(--muted); } .small { font-size: .84rem; }
.wrap { width: 100%; max-width: 560px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Lock */
.lock { position: fixed; inset: 0; z-index: 40; background: radial-gradient(120% 70% at 50% 0%, #142030 0%, var(--bg) 60%); display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); overflow: auto; }
.lock-in { width: 100%; max-width: 320px; display: grid; justify-items: center; gap: 6px; text-align: center; padding-block: 24px; }
.lock .mark { width: 64px; height: 64px; }
.app-name { margin: 4px 0 8px; font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; color: var(--muted); }
.lock h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
.lock .muted { margin: 0; min-height: 1.6em; font-size: .9rem; }
.dots { display: flex; gap: 14px; margin: 18px 0 4px; direction: ltr; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); transition: background .12s, border-color .12s; }
.dots i.on { background: var(--fg); border-color: var(--fg); }
.dots.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.err { margin: 0; min-height: 1.5em; color: var(--red); font-weight: 600; font-size: .9rem; }
.keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 22px; margin-top: 8px; direction: ltr; }
.keypad button { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--surface-2); font-family: var(--font-num); font-size: 1.7rem; font-weight: 500; }
.keypad button:active { background: var(--line); }
.lock.busy .keypad { opacity: .45; pointer-events: none; }

/* Top + tabs */
.top { position: sticky; top: 0; z-index: 10; background: rgba(10, 14, 19, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top-in { display: flex; align-items: center; gap: 8px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; margin-inline-end: auto; font-size: 1.1rem; font-weight: 800; }
.brand svg { width: 28px; height: 28px; }
.sync { font-size: .74rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--green); } .sync.off::before { background: var(--amber); } .sync.busy::before { background: var(--blue); animation: blink 1s infinite; }
.sync.demo { color: var(--gold); } .sync.demo::before { background: var(--gold); }
@keyframes blink { 50% { opacity: .3; } }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn svg, .tabbar svg, .fab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.main { display: grid; gap: 12px; padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(14, 19, 26, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: .72rem; font-weight: 600; border-radius: 12px; }
.tabbar button[aria-current="page"] { color: var(--fg); }
.tabbar button[aria-current="page"] svg { stroke: var(--blue); }
.fab { position: fixed; z-index: 11; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--blue); color: #061321; display: grid; place-items: center; box-shadow: 0 10px 28px rgba(90, 167, 255, .35); }
.fab svg { width: 26px; height: 26px; stroke-width: 2.4; }

/* Cards & bits */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.card h3, h3.sec { margin: 0; font-size: 1rem; font-weight: 700; }
h3.sec, h4.sec { margin: 8px 2px 0; }
h4.sec { font-size: .95rem; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.phead h2 { margin: 0; font-size: 1.35rem; font-weight: 700; }
.phead p { margin: 0; color: var(--muted); font-size: .84rem; }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.link { border: 0; background: none; color: var(--blue); font-weight: 600; font-size: .86rem; }
.link.more { display: block; margin: 8px auto 0; padding: 6px 12px; }
.ghost-btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: .86rem; white-space: nowrap; }
.ghost-btn.full { width: 100%; min-height: 48px; }
.empty { margin: 0; color: var(--muted); text-align: center; padding: 14px 6px; }
.amt { white-space: nowrap; }
.amt small { color: var(--muted); font-size: .72em; font-weight: 500; }
.amt.big .num { font-size: 1.35rem; }
.bar { height: 6px; border-radius: 6px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; }
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { display: block; }
.ring-val { animation: ring-in 1s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes ring-in { from { stroke-dasharray: 0 var(--len); } }
.ring-in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-in b { font-size: 1.55rem; font-family: var(--font-num); }
.ring-in small { color: var(--muted); font-size: .72rem; }
.ring-in b.tiny { font-size: .82rem; }

.hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.hero-side { display: grid; gap: 8px; min-width: 0; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.kv span { color: var(--muted); font-size: .84rem; }
.kv b { font-size: 1.05rem; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 10px; display: grid; gap: 0; text-align: start; min-width: 0; }
.tile span { color: var(--muted); font-size: .8rem; }
.tile b { font-size: 1.15rem; overflow-wrap: anywhere; }
.tile small { color: var(--muted); font-size: .72rem; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.trio div { display: grid; gap: 2px; min-width: 0; }
.trio span { color: var(--muted); font-size: .8rem; }
.trio .num { font-size: 1.12rem; }

.agenda { list-style: none; margin: 0; padding: 0; display: grid; }
.agenda li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.agenda li:first-child { border-top: 0; }
.dir { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; flex: none; }
.dir.out { background: var(--red-soft); color: var(--red); } .dir.in { background: var(--green-soft); color: var(--green); }
.ag-t { flex: 1; min-width: 0; display: grid; }
.ag-t b { font-size: .95rem; overflow-wrap: anywhere; }
.ag-t span { color: var(--muted); font-size: .8rem; }
.ag-t em { color: var(--red); font-style: normal; font-weight: 700; }
.agenda li.late { background: linear-gradient(90deg, transparent, var(--red-soft)); }
.ag-a { display: grid; justify-items: end; gap: 4px; }
.mini { border: 0; border-radius: 10px; padding: 5px 12px; font-size: .8rem; font-weight: 700; background: var(--blue-soft); color: var(--blue); }
.mini.wide { width: 100%; padding: 10px; font-size: .9rem; margin-top: 10px; }
.mini.green-btn { background: var(--green-soft); color: var(--green); }

.insights { display: grid; gap: 8px; }
.ins { border-radius: 14px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 4px solid var(--blue); }
.ins p { margin: 0; font-size: .92rem; }
.ins.bad { border-inline-start-color: var(--red); background: linear-gradient(90deg, var(--surface), var(--red-soft)); }
.ins.warn { border-inline-start-color: var(--amber); }

/* Spend */
.monthnav { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.monthnav button { width: 44px; height: 40px; border: 0; background: none; border-radius: 10px; font-size: 1.4rem; color: var(--fg); }
.monthnav button:disabled { opacity: .25; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.donut-wrap { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; margin-top: 12px; }
.donut .ring-in b { font-size: 1.15rem; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto auto 46px; gap: 8px; align-items: center; font-size: .86rem; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend em { font-style: normal; color: var(--muted); font-size: .78rem; }
.legend small { font-size: .74rem; text-align: left; }
.bars { width: 100%; height: auto; margin-top: 10px; display: block; }
.lg { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); }
.lg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 5px; }
.day { margin: 8px 4px 2px; color: var(--muted); font-size: .8rem; font-weight: 600; }
.txl { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.txl li + li { border-top: 1px solid var(--line); }
.txl button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; background: none; text-align: start; }
.txl .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.tx-t { flex: 1; min-width: 0; display: grid; }
.tx-t b { font-weight: 600; font-size: .94rem; }
.tx-t small { color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Debts / receivables */
.prov { padding: 0; overflow: hidden; }
.prov.has-late { border-color: rgba(255, 93, 93, .45); }
.prov-h { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 0; background: none; text-align: start; }
.prov-t { flex: 1; min-width: 0; display: grid; }
.prov-t b { font-size: 1.02rem; }
.prov-t small { color: var(--muted); font-size: .8rem; }
.prov-t em { color: var(--red); font-style: normal; font-weight: 700; }
.plans { display: grid; gap: 10px; padding: 0 12px 14px; }
.plan { background: var(--surface-2); border-radius: 16px; padding: 12px; }
.plan.done { opacity: .7; }
.plan.late { box-shadow: inset 0 0 0 1px rgba(255, 93, 93, .45); }
.plan.rev { display: flex; align-items: center; gap: 10px; }
.plan.rev .plan-t { flex: 1; display: grid; }
.plan.rev small { color: var(--muted); font-size: .76rem; }
.plan-main { width: 100%; border: 0; background: none; padding: 0; text-align: start; display: grid; gap: 7px; }
.plan-t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.plan-t b { font-size: .98rem; }
.plan-n { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; flex-wrap: wrap; }
.plan-n.muted { color: var(--muted); font-size: .78rem; }
.badge { font-size: .74rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.badge.r { background: var(--red-soft); color: var(--red); } .badge.g { background: var(--green-soft); color: var(--green); }
.badge.a { background: var(--amber-soft); color: var(--amber); } .badge.b { background: var(--blue-soft); color: var(--blue); }
.note-line { margin: 0; font-size: .84rem; padding: 0 4px; }
.prov-actions { display: flex; gap: 8px; justify-content: flex-end; }
.person.late { border-color: rgba(255, 93, 93, .45); }

.accl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.accl li { display: grid; gap: 6px; }
.accl button { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; background: none; padding: 0; text-align: start; }
.acc-t { display: grid; } .acc-t small { color: var(--muted); font-size: .76rem; }
.acc-big { text-align: center; padding: 6px 0 14px; }
.acc-big .num { font-size: 2rem; }

/* Sheet & forms */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 0 10px; z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 1.1rem; }
.sheet-body { display: grid; gap: 12px; }
.frm { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field > label { font-weight: 600; font-size: .88rem; color: var(--muted); }
.field input, .field select { width: 100%; min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); padding: 10px 14px; font-size: 1rem; }
.field input:focus, .field select:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field input[type="date"] { direction: ltr; text-align: right; }
.help { color: var(--muted); font-size: .78rem; }
.amount-in { display: flex; align-items: center; gap: 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 16px; }
.amount-in:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.field .amount-in input { border: 0; background: none; box-shadow: none; font-family: var(--font-num); font-size: 2rem; font-weight: 600; min-height: 66px; padding: 0; direction: ltr; text-align: right; }
.amount-in span { color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 13px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.chips button i { width: 9px; height: 9px; border-radius: 50%; }
.chips button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--fg); }
.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg2 button { justify-content: center; border-radius: 12px; }
.kind-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
.kind-tabs button { border: 0; background: none; border-radius: 10px; padding: 9px; font-weight: 700; color: var(--muted); }
.kind-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
.kind-tabs button:disabled { opacity: .4; }
.btn { min-height: 52px; border: 0; border-radius: 14px; background: var(--blue); color: #061321; font-weight: 700; font-size: 1.02rem; width: 100%; }
.btn.soft { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(255, 93, 93, .35); min-height: 46px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.preview { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: .9rem; line-height: 1.8; }
.preview.good { box-shadow: inset 0 0 0 1px rgba(49, 208, 138, .4); } .preview.bad { box-shadow: inset 0 0 0 1px rgba(255, 93, 93, .45); }
.catl, .setl { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface-2); border-radius: 16px; overflow: hidden; }
.catl li + li, .setl li + li { border-top: 1px solid var(--line); }
.catl button, .setl button, .filebtn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 0; background: none; text-align: start; cursor: pointer; }
.catl i { width: 10px; height: 10px; border-radius: 50%; }
.catl b { flex: 1; font-weight: 600; } .catl small { color: var(--muted); }
.setl button, .filebtn { display: grid; gap: 1px; }
.setl small, .filebtn small { color: var(--muted); font-size: .78rem; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.danger-t b { color: var(--red); }
.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: .92rem; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }

@media (max-width: 370px) {
  .hero { grid-template-columns: 1fr; justify-items: center; }
  .hero-side { width: 100%; }
  .donut-wrap { grid-template-columns: 1fr; justify-items: center; }
  .legend { width: 100%; }
  .keypad { grid-template-columns: repeat(3, 68px); gap: 12px 18px; }
  .keypad button { width: 68px; height: 68px; }
}
@media (prefers-reduced-motion: reduce) { .ring-val, .sheet-panel, .dots.shake, .sync.busy::before { animation: none; } }

/* Forecast table */
.fc-wrap { overflow-x: auto; margin: 0 -4px; }
.fc { width: 100%; border-collapse: collapse; font-size: .9rem; }
.fc th, .fc td { padding: 9px 6px; text-align: start; border-top: 1px solid var(--line); }
.fc thead th { color: var(--muted); font-weight: 600; font-size: .78rem; border-top: 0; }
.fc td { text-align: left; white-space: nowrap; }
.fc td.tot { font-weight: 700; color: var(--red); }
.fc th button { border: 0; background: none; padding: 0; font-weight: 600; color: var(--fg); white-space: nowrap; }
.fc th button::after { content: " ‹"; color: var(--muted); }

.fc tr.open, .fc-items { background: var(--surface-2); }
.fc-items td { padding: 4px 10px 10px; text-align: start; white-space: normal; }
.fc-items ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.fc-items li { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; }
.fc-items small { color: var(--muted); }
.nextm { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: start; width: 100%; color: inherit; }
.nextm span { color: var(--muted); font-size: .88rem; }
.nextm b { font-size: 1.35rem; color: var(--red); grid-row: span 2; }
.nextm small.muted { font-size: .78rem; }

/* Advisor */
.adv { display: grid; gap: 10px; }
.adv .row-head { margin-bottom: 0; }
.stack { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: var(--track); gap: 2px; }
.stack i { display: block; height: 100%; }
.adv-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.adv-l li { display: grid; grid-template-columns: 10px 1fr auto 42px; gap: 8px; align-items: center; font-size: .9rem; }
.adv-l i { width: 10px; height: 10px; border-radius: 3px; }
.adv-l em { font-style: normal; color: var(--muted); font-size: .8rem; text-align: left; }
.sub-h { margin: 6px 0 0; font-size: .95rem; }
.advt { width: 100%; border-collapse: collapse; font-size: .9rem; }
.advt th, .advt td { padding: 7px 4px; border-top: 1px solid var(--line); text-align: start; }
.advt thead th { color: var(--muted); font-size: .76rem; font-weight: 600; border-top: 0; }
.advt td { text-align: left; }
.advt th button { border: 0; background: none; padding: 0; color: var(--fg); font-weight: 600; text-align: start; }
.amber { color: var(--amber); }
.ins.good { border-inline-start-color: var(--green); }
.ins p + p { margin-top: 6px; }

/* Ends + chat */
.ends { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: baseline; background: var(--green-soft); border-radius: 14px; padding: 10px 12px; }
.ends span { font-size: .86rem; } .ends > b { color: var(--green); font-size: 1rem; } .ends small { color: var(--muted); font-size: .78rem; }
.btn.ask { background: var(--surface-2); color: var(--fg); border: 1px solid var(--blue); }
.sheet-body.chat-body { height: calc(92vh - 70px); }
.chat { display: grid; grid-template-rows: 1fr auto auto auto; gap: 10px; height: 100%; min-height: 0; }
.msgs { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; min-height: 0; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; font-size: .95rem; line-height: 1.7; overflow-wrap: anywhere; }
.msg p { margin: 0; } .msg p + p { margin-top: 6px; }
.msg ul { margin: 4px 0; padding-inline-start: 18px; }
.msg.me { align-self: flex-start; background: var(--blue); color: #061321; border-end-start-radius: 6px; }
.msg.ai { align-self: flex-end; background: var(--surface-2); border: 1px solid var(--line); border-end-end-radius: 6px; }
.msg.err { align-self: center; background: var(--red-soft); color: var(--red); font-size: .88rem; }
.typing { display: flex; gap: 5px; padding: 14px 16px; }

.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.sugg { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }

.chat-in textarea:focus { outline: 0; border-color: var(--blue); }
.ci-btn { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 16px; background: var(--blue); color: #061321; font-size: 1.3rem; font-weight: 700; }
.ci-btn.ghost { background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); }
.ci-btn:disabled { opacity: .4; }
.chat-in.rec { align-items: center; }
.rec-t { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 16px; background: var(--red-soft); color: var(--red); }

@keyframes recblink { 50% { opacity: .25; } }

.keybox { display: grid; gap: 10px; } .keybox ol, .keybox ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; } .keybox a { color: var(--blue); }

<script>
/* الحسابات كلها: الأرصدة، الأقساط ومواعيدها، المستحق ليا، ملخص الشهر، والتنبيهات */
var Fin = (function () {
  'use strict';

  var CUR = { AED: { name: 'درهم', short: 'د.إ' }, EGP: { name: 'جنيه', short: 'ج.م' }, GOLD: { name: 'جرام', short: 'جم' } };
  var EPS = 0.005;

  /* ---------- تواريخ ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function addMonths(d, k, day) {
    var y = d.getFullYear(), m = d.getMonth() + k;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return new Date(y, m, Math.min(day || d.getDate(), daysIn(y, m)));
  }
  function diffDays(a, b) { return Math.round((a - b) / 864e5); }
  function monthKey(s) { return String(s).slice(0, 7); }
  function todayDate(t) { var d = t ? parse(t) : new Date(); d.setHours(0, 0, 0, 0); return d; }

  function list(coll) { return Object.keys(coll || {}).map(function (k) { return coll[k]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }

  /* ---------- أرصدة الحسابات ---------- */
  function txOf(db) { return list(db.tx).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }

  function accountBalance(db, accId) {
    var acc = db.accounts[accId];
    var b = acc ? Number(acc.opening) || 0 : 0;
    list(db.tx).forEach(function (t) {
      var a = Number(t.amount) || 0;
      if (t.type === 'income' && t.accountId === accId) b += a;
      else if (t.type === 'expense' && t.accountId === accId) b -= a;
      else if (t.type === 'transfer') {
        if (t.accountId === accId) b -= a;
        if (t.toAccountId === accId) b += Number(t.toAmount) || 0;
      } else if ((t.type === 'planPay' || t.type === 'cardPay') && t.accountId === accId) b -= a;
      else if (t.type === 'recv' && t.accountId === accId) b += a;
      else if (t.type === 'adjust' && t.accountId === accId) b += a;
      if (t.type === 'expense' && t.egpAccountId === accId) b += Number(t.egpAmount) || 0;
    });
    return round2(b);
  }

  function savings(db) {
    var out = { AED: 0, EGP: 0, GOLD: 0, accounts: [] };
    list(db.accounts).filter(function (a) { return !a.archived; }).sort(byOrder).forEach(function (a) {
      var bal = accountBalance(db, a.id);
      out[a.currency] = round2(out[a.currency] + bal);
      out.accounts.push({ acc: a, balance: bal });
    });
    return out;
  }
  function byOrder(a, b) { return (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), 'ar'); }

  /* ---------- جدول الأقساط (اللي عليا + المستحق ليا) ---------- */
  // item: { total, monthly, first: 'YYYY-MM-DD' (ميعاد أول قسط), before: مدفوع قبل التسجيل }, paid: مدفوع من التطبيق
  function schedule(item, paidInApp, today) {
    var total = Number(item.total) || 0, monthly = Number(item.monthly) || 0;
    if (monthly <= 0) monthly = total;
    var first = parse(item.first) || today;
    var paid = round2((Number(item.before) || 0) + (paidInApp || 0));
    var remaining = Math.max(0, round2(total - paid));
    var n = monthly > 0 ? Math.max(1, Math.ceil(total / monthly - 1e-9)) : 1;
    var day = first.getDate();
    var due = function (k) { return addMonths(first, k, day); };
    var r = {
      total: total, monthly: monthly, paid: Math.min(paid, total), remaining: remaining, count: n,
      pct: total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0,
      end: iso(due(n - 1)), state: 'upcoming', next: null, late: null, monthsLeft: monthly > 0 ? Math.ceil(remaining / monthly - 1e-9) : 0,
    };
    if (remaining <= EPS) { r.state = 'done'; r.monthsLeft = 0; return r; }
    var dueCount = 0;
    while (dueCount < n && due(dueCount) <= today) dueCount++;
    var expected = Math.min(total, dueCount * monthly);
    if (paid + EPS < expected) {
      var u = Math.floor((paid + EPS) / monthly);
      var since = due(u);
      r.state = 'late';
      r.late = { amount: round2(expected - paid), since: iso(since), days: diffDays(today, since), installments: dueCount - u };
    }
    var nextIdx = Math.max(dueCount, Math.floor((paid + EPS) / monthly));
    if (nextIdx < n) {
      var d = due(nextIdx);
      r.next = { date: iso(d), days: diffDays(d, today), amount: round2(Math.min(remaining, (nextIdx + 1) * monthly - paid) - (r.late ? r.late.amount : 0)) };
      if (r.next.amount <= EPS) r.next.amount = round2(Math.min(monthly, remaining));
    }
    return r;
  }

  function planPaid(db, planId) {
    return round2(list(db.tx).filter(function (t) { return t.type === 'planPay' && t.planId === planId; })
      .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0));
  }
  function recvPaid(db, rid) {
    return round2(list(db.tx).filter(function (t) { return t.type === 'recv' && t.receivableId === rid; })
      .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0));
  }
  function revolving(db, providerId) {
    var b = 0;
    list(db.tx).forEach(function (t) {
      if (t.type === 'expense' && t.providerId === providerId && !t.accountId) b += Number(t.amount) || 0;
      if (t.type === 'cardPay' && t.providerId === providerId) b -= Number(t.amount) || 0;
    });
    return Math.max(0, round2(b));
  }

  function debts(db, todayStr) {
    var today = todayDate(todayStr);
    var providers = list(db.providers).filter(function (p) { return !p.archived; }).sort(byOrder).map(function (p) {
      var plans = list(db.plans).filter(function (x) { return x.providerId === p.id && !x.archived; })
        .map(function (x) { return { plan: x, s: schedule(x, planPaid(db, x.id), today) }; })
        .sort(function (a, b) { return (a.s.state === 'done') - (b.s.state === 'done') || String(a.plan.first).localeCompare(String(b.plan.first)); });
      var rev = revolving(db, p.id);
      var total = 0, paid = 0, remaining = rev, monthly = 0;
      plans.forEach(function (x) { total += x.s.total; paid += x.s.paid; remaining += x.s.remaining; if (x.s.state !== 'done') monthly += x.s.monthly; });
      var fromOthers = list(db.receivables).filter(function (r) { return r.providerId === p.id && !r.archived; })
        .reduce(function (s, r) { return s + schedule(r, recvPaid(db, r.id), today).remaining; }, 0);
      return {
        provider: p, plans: plans, revolving: rev, total: round2(total + rev), paid: round2(paid), remaining: round2(remaining),
        monthly: round2(monthly), fromOthers: round2(fromOthers), mine: round2(Math.max(0, remaining - fromOthers)),
        pct: total + rev > 0 ? Math.round(paid / (total + rev) * 100) : 0,
        late: plans.some(function (x) { return x.s.state === 'late'; }),
      };
    });
    var sum = { total: 0, paid: 0, remaining: 0, monthly: 0, fromOthers: 0 };
    providers.forEach(function (p) { sum.total += p.total; sum.paid += p.paid; sum.remaining += p.remaining; sum.monthly += p.monthly; sum.fromOthers += p.fromOthers; });
    Object.keys(sum).forEach(function (k) { sum[k] = round2(sum[k]); });
    sum.pct = sum.total > 0 ? Math.round(sum.paid / sum.total * 100) : 0;
    return { providers: providers, sum: sum };
  }

  function receivables(db, todayStr) {
    var today = todayDate(todayStr);
    var items = list(db.receivables).filter(function (r) { return !r.archived; }).map(function (r) {
      return { rec: r, s: schedule(r, recvPaid(db, r.id), today), provider: db.providers[r.providerId] || null };
    }).sort(function (a, b) {
      var rank = { late: 0, upcoming: 1, done: 2 };
      return rank[a.s.state] - rank[b.s.state] || String(a.rec.person).localeCompare(String(b.rec.person), 'ar');
    });
    var sum = { total: 0, paid: 0, remaining: 0, monthly: 0, late: 0 };
    items.forEach(function (x) {
      sum.total += x.s.total; sum.paid += x.s.paid; sum.remaining += x.s.remaining;
      if (x.s.state !== 'done') sum.monthly += x.s.monthly;
      if (x.s.late) sum.late += x.s.late.amount;
    });
    Object.keys(sum).forEach(function (k) { sum[k] = round2(sum[k]); });
    sum.pct = sum.total > 0 ? Math.round(sum.paid / sum.total * 100) : 0;
    return { items: items, sum: sum };
  }

  // كل المواعيد الجاية (اللي عليا واللي ليا) لحد آخر الشهر الجاي + أي متأخر
  function agenda(db, todayStr, horizonDays) {
    var today = todayDate(todayStr), out = [];
    var hz = horizonDays == null ? 31 : horizonDays;
    debts(db, todayStr).providers.forEach(function (p) {
      p.plans.forEach(function (x) {
        if (x.s.late) out.push({ dir: 'out', kind: 'late', title: x.plan.title, sub: p.provider.name, amount: x.s.late.amount, date: x.s.late.since, days: -x.s.late.days, ref: x.plan.id });
        if (x.s.next && x.s.next.days <= hz) out.push({ dir: 'out', kind: 'due', title: x.plan.title, sub: p.provider.name, amount: x.s.next.amount, date: x.s.next.date, days: x.s.next.days, ref: x.plan.id });
      });
    });
    receivables(db, todayStr).items.forEach(function (x) {
      if (x.s.late) out.push({ dir: 'in', kind: 'late', title: x.rec.person, sub: x.provider ? x.provider.name : '', amount: x.s.late.amount, date: x.s.late.since, days: -x.s.late.days, ref: x.rec.id });
      if (x.s.next && x.s.next.days <= hz) out.push({ dir: 'in', kind: 'due', title: x.rec.person, sub: x.provider ? x.provider.name : '', amount: x.s.next.amount, date: x.s.next.date, days: x.s.next.days, ref: x.rec.id });
    });

  }

  /* ---------- المصاريف والدخل ---------- */
  function txCurrency(db, t) {

  }
  // المصروف بالمعنى اللي بيتحسب في التحليل: مصروف عادي أو قسط اتدفع

  function month(db, key, currency) {
    var cur = currency || 'AED';
    var r = { key: key, income: 0, spent: 0, byCat: {}, items: [] };
    list(db.tx).forEach(function (t) {
      if (monthKey(t.date) !== key || txCurrency(db, t) !== cur) return;
      var a = Number(t.amount) || 0;

    r.cats = Object.keys(r.byCat).map(function (k) { return { id: k, amount: r.byCat[k] }; }).sort(function (a, b) { return b.amount - a.amount; });

  }

  /* ---------- التنبيهات الذكية ---------- */
  function insights(db, todayStr, currency) {
    var cur = currency || 'AED';
    var today = todayDate(todayStr);
    var key = iso(today).slice(0, 7);
    var m = month(db, key, cur);
    var prev = [1, 2, 3].map(function (k) { return month(db, prevKey(key, k), cur); });
    var hasHistory = prev.some(function (p) { return p.spent > 0; });
    var out = [];
    var dim = daysIn(today.getFullYear(), today.getMonth()), day = today.getDate(), left = dim - day;
    var sym = CUR[cur].name;

    // متأخرات
    debts(db, todayStr).providers.forEach(function (p) {

        if (x.s.late) out.push({ level: 'bad', icon: 'late', text: 'قسط «' + x.plan.title + '» (' + p.provider.name + ') متأخر ' + days(x.s.late.days) + ' بمبلغ ' + fmt(x.s.late.amount) + ' درهم.' });

          out.push({ level: 'warn', icon: 'up', text: '«' + catName(db, c.id) + '» الشهر ده ' + fmt(c.amount) + ' ' + sym + '، أعلى من متوسطك بـ ' + Math.round((c.amount / avg - 1) * 100) + '%.' });
        }

    }

    // ميزانية البنود

    }

    // الحسابات اللي محتاجة مطابقة
    list(db.accounts).filter(function (a) { return !a.archived && a.currency !== 'GOLD'; }).forEach(function (a) {
      var last = a.checkedAt || a.createdAt || '';
      if (!last) return;
      var d = diffDays(today, parse(String(last).slice(0, 10)) || today);
      if (d >= 30) out.push({ level: 'info', icon: 'check', text: 'بقالك ' + days(d) + ' ما طابقتش رصيد «' + a.name + '». اكتب الرصيد الحقيقي عشان نعرف لو فيه فلوس ناقصة.' });
    });

    var rank = { bad: 0, warn: 1, info: 2 };
    return out.sort(function (a, b) { return rank[a.level] - rank[b.level]; });
  }

  // الفرق بين الرصيد الحقيقي واللي متسجل
  function reconcile(db, accId, actual) {

  }

  function months(db, n, currency, todayStr) {

  /* ---------- جدول الشهور: عليا كام كل شهر ---------- */

    if (!first || !(total > 0)) return [];
    var P = (Number(item.before) || 0) + (paid || 0), n = Math.max(1, Math.ceil(total / m - 1e-9)), out = [];
    for (var k = 0; k < n; k++) {

  }
  function forecast(db, todayStr, maxMonths) {

    var row = function (k) { if (!rows[k]) rows[k] = { key: k, out: 0, inn: 0, items: [] }; return rows[k]; };
    list(db.plans).filter(function (x) { return !x.archived && db.providers[x.providerId] && !db.providers[x.providerId].archived; }).forEach(function (x) {
      dues(x, planPaid(db, x.id)).forEach(function (d) {
        var k = d.date.slice(0, 7) < now ? now : d.date.slice(0, 7), r = row(k);
        r.out += d.amount; r.items.push({ dir: 'out', title: x.title, sub: db.providers[x.providerId].name, amount: d.amount, date: d.date });
        if (k > last) last = k;
      });
    });
    list(db.receivables).filter(function (x) { return !x.archived; }).forEach(function (x) {
      dues(x, recvPaid(db, x.id)).forEach(function (d) {
        var k = d.date.slice(0, 7) < now ? now : d.date.slice(0, 7), r = row(k);
        r.inn += d.amount; r.items.push({ dir: 'in', title: x.person, sub: (db.providers[x.providerId] || {}).name || '', amount: d.amount, date: d.date });
        if (k > last) last = k;
      });
    });
    var fixed = list(db.fixed).filter(function (f) { return !f.archived && f.kind !== 'income'; });
    var fixedSum = round2(fixed.reduce(function (a, f) { return a + (Number(f.amount) || 0); }, 0));
    var out = [], k = now, cap = maxMonths || 36;
    while (k <= last && out.length < cap) {

      r.out = round2(r.out); r.inn = round2(r.inn); r.fixed = fixedSum;
      r.mine = round2(r.out - r.inn);
      r.total = round2(r.mine + fixedSum);
      r.items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      out.push(r);
      k = iso(addMonths(parse(k + '-01'), 1, 1)).slice(0, 7);
    }
    return { months: out, fixed: fixed, fixedSum: fixedSum, freeFrom: k };
  }

  /* ---------- المستشار ---------- */
  // مبني على قواعد معروفة: ادفع لنفسك الأول، 50/30/20، صندوق طوارئ 3 شهور، الأقساط أقل من 36% من الدخل، وطريقة كرة التلج للديون
  var WEIGHTS = [
    [/أكل|سوبر/, .32, 'need'], [/مصر|تحويل/, .20, 'family'], [/مطاعم|كافيه/, .10, 'want'], [/تسوق|شوب/, .10, 'want'],
    [/ترفيه/, .07, 'want'], [/صحة|علاج|دوا/, .05, 'need'], [/اشتراك/, .04, 'want'],
  ];
  function r50(n) { return Math.round(n / 50) * 50; }
  function monthsWord(n) { return n === 1 ? 'شهر' : n === 2 ? 'شهرين' : n <= 10 ? n + ' شهور' : n + ' شهر'; }
  function incomeOf(db, todayStr) {
    var set = list(db.fixed).filter(function (f) { return !f.archived && f.kind === 'income'; }).reduce(function (a, f) { return a + (Number(f.amount) || 0); }, 0);
    if (set > 0) return { amount: round2(set), src: 'set' };
    var key = iso(todayDate(todayStr)).slice(0, 7), sum = 0, n = 0;
    for (var k = 1; k <= 3; k++) { var m = month(db, prevKey(key, k), 'AED'); if (m.income > 0) { sum += m.income; n++; } }
    return { amount: n ? round2(sum / n) : 0, src: n ? 'actual' : 'none' };
  }
  function ownPlans(db) {
    return list(db.plans).filter(function (x) { return !x.archived && x.kind !== 'others' && db.providers[x.providerId] && !db.providers[x.providerId].archived; });
  }
  // كرة التلج: لما قسط يخلص، فلوسه تروح على أصغر قسط مرن (اللي ينفع تدفع فيه زيادة)
  function snowball(db, todayStr) {
    var today = todayDate(todayStr), start = iso(addMonths(today, 1, 1)).slice(0, 7);
    var plans = ownPlans(db).map(function (x) {
      var d = dues(x, planPaid(db, x.id));
      return { id: x.id, title: x.title, flexible: x.kind !== 'epp', dues: d, remaining: round2(d.reduce(function (a, b) { return a + b.amount; }, 0)) };
    }).filter(function (x) { return x.remaining > EPS; });
    if (!plans.length) return null;
    var baseEnd = plans.reduce(function (a, x) { var e = x.dues[x.dues.length - 1].date.slice(0, 7); return e > a ? e : a; }, '');
    var monthsOf = function (k) { var out = 0; plans.forEach(function (x) { x.dues.forEach(function (d) { var mk = d.date.slice(0, 7) < start ? start : d.date.slice(0, 7); if (mk === k) out += d.amount; }); }); return out; };
    var budget = round2(monthsOf(start));
    var rem = {}; plans.forEach(function (x) { rem[x.id] = x.remaining; });
    var k = start, guard = 0, firstExtra = null;
    while (plans.some(function (x) { return rem[x.id] > EPS; }) && guard++ < 120) {

      plans.forEach(function (x) {   // الأقساط العادية الأول
        var due = 0; x.dues.forEach(function (d) { var mk = d.date.slice(0, 7) < start ? start : d.date.slice(0, 7); if (mk === k) due += d.amount; });
        var pay = Math.min(rem[x.id], due); rem[x.id] = round2(rem[x.id] - pay); left = round2(left - pay);
      });
      while (left > EPS) {           // الفلوس الفاضية على أصغر قسط مرن
        var t = plans.filter(function (x) { return x.flexible && rem[x.id] > EPS; }).sort(function (a, b) { return rem[a.id] - rem[b.id]; })[0];
        if (!t) break;
        if (!firstExtra) firstExtra = { month: k, title: t.title, amount: Math.min(left, rem[t.id]) };
        var p = Math.min(left, rem[t.id]); rem[t.id] = round2(rem[t.id] - p); left = round2(left - p);
      }

    return { budget: budget, baseEnd: baseEnd, snowEnd: k, monthsSaved: Math.max(0, diff), firstExtra: firstExtra };
  }
  function advise(db, todayStr) {
    var inc = incomeOf(db, todayStr), I = inc.amount;
    var fc = forecast(db, todayStr, 36), now = iso(todayDate(todayStr)).slice(0, 7);
    var row = fc.months.filter(function (m) { return m.items.length && m.mine > 0; })[0] || fc.months[0] || { key: now, mine: 0, fixed: fc.fixedSum };
    var inst = Math.max(0, row.mine), fixedExp = fc.fixedSum, committed = round2(inst + fixedExp);
    var dti = I ? inst / I : 0, housing = I ? fixedExp / I : 0;
    var rate = dti >= 0.36 ? 0.05 : dti > 0.15 ? 0.10 : 0.20;
    if (I && I - committed < I * 0.3) rate = 0.05;
    var save = I ? r50(I * rate) : 0;
    var available = Math.max(0, round2(I - committed - save));
    var cs = list(db.categories).filter(function (c) { return (c.kind || 'expense') === 'expense' && !c.archived && c.system !== 'inst' && !/إيجار/.test(c.name); });
    var picked = cs.map(function (c) {
      var w = WEIGHTS.filter(function (x) { return x[0].test(c.name); })[0];
      return { id: c.id, name: c.name, w: w ? w[1] : 0, type: w ? w[2] : 'other', budget: Number(c.budget) || 0 };
    });
    var otherW = Math.max(0.08, 1 - picked.reduce(function (a, c) { return a + c.w; }, 0));
    var others = picked.filter(function (c) { return !c.w; });
    others.forEach(function (c) { c.w = otherW / others.length; });
    var tw = picked.reduce(function (a, c) { return a + c.w; }, 0) || 1;
    picked.forEach(function (c) { c.suggest = Math.max(0, r50(available * c.w / tw)); });
    picked.sort(function (a, b) { return b.suggest - a.suggest; });
    // الباقي من التقريب يروح على «أخرى»
    var drift = round2(available - picked.reduce(function (a, c) { return a + c.suggest; }, 0));
    var oth = picked.filter(function (c) { return c.type === 'other'; })[0] || picked[picked.length - 1];
    if (oth) oth.suggest = Math.max(0, Math.floor(oth.suggest + drift));
    var planned = picked.reduce(function (a, c) { return a + (c.budget || c.suggest); }, 0);
    var food = picked.filter(function (c) { return /أكل|سوبر/.test(c.name); })[0];
    var health = picked.filter(function (c) { return /صحة/.test(c.name); })[0];
    var essentials = round2(committed + (food ? food.budget || food.suggest : 0) + (health ? health.budget || health.suggest : 0));
    var efTarget = Math.round(3 * essentials / 500) * 500, efStarter = Math.round(essentials / 500) * 500;
    var held = savings(db).AED;

      dti: Math.round(dti * 100), housing: Math.round(housing * 100), rate: Math.round(rate * 100), save: save, available: available,

    };
  }
  // قبل ما تشتري: كاش ولا قسط ولا تستنى
  function purchase(db, todayStr, price, months, need) {
    var a = advise(db, todayStr), I = a.income, fc = forecast(db, todayStr, 36).months;
    var res = { price: price, months: months, verdict: 'ok', lines: [] };
    if (!I) { res.verdict = 'unknown'; res.lines.push('اكتب دخلك الشهري الأول عشان أقدر أحسب.'); return res; }
    var big = price >= I * 0.1;
    if (!months) {
      var after = round2(a.held - price);
      if (after < a.efStarter) {
        res.verdict = need ? 'careful' : 'wait';
        res.lines.push(after < 0 ? 'الكاش اللي معاك (' + fmt(a.held) + ' درهم) مش مكفي.' : 'لو دفعته كاش هيتبقى معاك ' + fmt(after) + ' درهم بس، وده أقل من صندوق الطوارئ المبدئي (' + fmt(a.efStarter) + ').');
        if (!need && a.save > 0) res.lines.push('حوّش له ' + monthsWord(Math.ceil(price / a.save)) + ' بالادخار الشهري (' + fmt(a.save) + ') بدل ما تسحب من الطوارئ أو تقسط.');
        if (need) {
          var room = I * 0.36 - a.inst;
          if (room > 0) { var mm = Math.max(1, Math.ceil(price / room - 1e-9)); res.lines.push('لو ضروري: قسطه على ' + monthsWord(mm) + ' (' + fmt(round2(price / mm)) + ' في الشهر). ده أقل عدد شهور يخلّي أقساطك تحت الحد الآمن 36%.'); }
          else res.lines.push('أقساطك دلوقتي فوق الحد الآمن. لو ضروري، ادفع جزء كاش وقسّط الباقي على أطول مدة ممكنة.');
        }
      } else res.lines.push('تقدر تدفعه كاش، وهيتبقى معاك ' + fmt(after) + ' درهم.');
      if (!need && big) res.lines.push('قاعدة الـ 30 يوم: استنى شهر قبل أي حاجة مش ضرورية فوق ' + fmt(r50(I * 0.1)) + ' درهم. لو لسه عايزها بعد شهر، اشتريها.');
      return res;

    var m = round2(price / months), dtiNow = I ? (a.inst + m) / I : 0;
    res.monthly = m;
    res.lines.push('القسط هيبقى ' + fmt(m) + ' درهم × ' + monthsWord(months) + '، وأقساطك هتوصل ' + Math.round(dtiNow * 100) + '% من دخلك.');
    if (dtiNow > 0.36) {
      res.verdict = 'no';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function db() { return Store.db; }
  function L(c) { return Fin.list(db()[c]); }
  function today() { return Fin.iso(new Date()); }
  function num(v) {
    var s = String(v == null ? '' : v).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; }).replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x06F0; })
      .replace(/[٫]/g, '.').replace(/[,٬\s]/g, '');
    return /^-?\d*\.?\d+$/.test(s) ? Number(s) : NaN;
  }
  function amt(n, cur, cls) { return '<span class="amt ' + (cls || '') + '"><span class="num">' + Fin.fmt(n) + '</span> <small>' + CURL[cur || 'AED'] + '</small></span>'; }
  function dLabel(s) { var d = Fin.parse(s); return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '') : '—'; }
  function mLabel(k) { var d = Fin.parse(k + '-01'); return MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function rel(days) {
    if (days < 0) return 'متأخر ' + Fin.days(-days);

  function byOrder(a, b) { return (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), 'ar'); }
  function cats(kind) { return L('categories').filter(function (c) { return (c.kind || 'expense') === kind && !c.archived; }).sort(byOrder); }
  function catColor(id) {
    var list = cats('expense').map(function (c) { return c.system === 'inst' ? '__inst' : c.id; });
    var i = list.indexOf(id); return PALETTE[(i < 0 ? list.length : i) % PALETTE.length];
  }
  function accounts(cur) { return L('accounts').filter(function (a) { return !a.archived && (!cur || a.currency === cur); }).sort(byOrder); }
  function providers() { return L('providers').filter(function (p) { return !p.archived; }).sort(byOrder); }

  function ring(pct, size, stroke, color, inner, label) {
    var r = (size - stroke) / 2, c = 2 * Math.PI * r, h = size / 2, v = Math.max(0, Math.min(100, pct || 0)), d = c * v / 100;
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px" role="img" aria-label="' + esc(label || v + '%') + '"><svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<circle cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + stroke + '"/>' +
      (v > 0 ? '<circle class="ring-val" cx="' + h + '" cy="' + h + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + d.toFixed(2) + ' ' + c.toFixed(2) + '" transform="rotate(-90 ' + h + ' ' + h + ')" style="--len:' + c.toFixed(2) + 'px"/>' : '') +
      '</svg><div class="ring-in">' + inner + '</div></div>';
  }
  function bar(pct, color) { return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%;background:' + color + '"></i></div>'; }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;

  /* =================== القفل =================== */
  var pinMode = 'unlock', pinBuf = '', pinFirst = '';
  function showLock(mode, msg) {
    pinMode = mode; pinBuf = ''; pinFirst = '';
    $('#app').hidden = true; $('#lock').hidden = false; closeSheet();
    var title = { unlock: 'ادخل الرقم السري', create: 'اختار رقم سري من 6 أرقام', login: 'ادخل الرقم السري بتاعك' }[mode];
    $('#lockTitle').textContent = title;
    $('#lockHint').textContent = msg || (mode === 'create' ? 'هتفتح بيه التطبيق كل مرة. متنساهوش.' : mode === 'login' ? 'جهاز جديد: هنجيب بياناتك من أكونت جوجل.' : (Store.demo() ? 'النسخة التجريبية: 123456' : ''));
    $('#lockErr').textContent = '';
    drawDots();
  }
  function drawDots() { $('#dots').innerHTML = [0, 1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i < pinBuf.length ? 'on' : '') + '"></i>'; }).join(''); }
  function pinKey(k) {
    if ($('#lock').hidden || $('#lock').classList.contains('busy')) return;
    if (k === 'del') pinBuf = pinBuf.slice(0, -1);
    else if (pinBuf.length < 6) pinBuf += k;
    $('#lockErr').textContent = '';
    drawDots();
    if (pinBuf.length === 6) setTimeout(submitPin, 120);
  }
  function busy(on) { $('#lock').classList.toggle('busy', on); }
  function pinError(msg) { $('#lockErr').textContent = msg; $('#dots').classList.add('shake'); setTimeout(function () { $('#dots').classList.remove('shake'); }, 400); pinBuf = ''; drawDots(); }
  function errText(e) {
    var m = e && e.message;
    if (m === 'wrong_pin') return 'الرقم السري غلط.' + (e.left != null && e.left <= 2 ? ' باقي ' + e.left + ' محاولات.' : '');
    if (m === 'locked') return 'محاولات كتير غلط. استنى ربع ساعة.';
    if (m === 'not_json') return 'رابط السيرفر في config.js مش مظبوط.';
    return 'مفيش اتصال بالإنترنت. جرب تاني.';
  }
  function submitPin() {
    var pin = pinBuf;
    if (pinMode === 'create' && !pinFirst) { pinFirst = pin; pinBuf = ''; $('#lockTitle').textContent = 'اكتبه تاني للتأكيد'; drawDots(); return; }
    if (pinMode === 'create' && pin !== pinFirst) { pinFirst = ''; $('#lockTitle').textContent = 'اختار رقم سري من 6 أرقام'; pinError('الرقمين مش زي بعض. ابدأ تاني.'); return; }
    busy(true);
    var p = pinMode === 'unlock' ? Store.unlock(pin) : pinMode === 'create' ? Store.create(pin) : Store.login(pin);

  function enterApp() { $('#lock').hidden = true; $('#app').hidden = false; render(); }
  function lockNow() { chat.contents = []; chat.log = []; Store.lock(); showLock('unlock'); }

  /* =================== الهيكل =================== */

    el.textContent = s.syncing ? 'بيتزامن…' : s.pending ? 'مش متزامن (' + s.pending + ')' : !s.online ? 'أوفلاين' : 'متزامن';

  /* =================== الرئيسية =================== */

    var ag = Fin.agenda(db(), T, 31), ins = Fin.insights(db(), T, 'AED');

      '</div></section>';

    if (nm) out += '<button class="card nextm" data-go="debts"><span>عليك ' + (nm.key === T.slice(0, 7) ? 'الشهر ده' : 'شهر ' + MONTHS[+nm.key.slice(5) - 1]) + '</span><b class="num">' + Fin.fmt(nm.total) + ' <small>درهم</small></b><small class="muted">أقساط ' + Fin.fmt(nm.mine) + (nm.fixed ? ' + ثابت ' + Fin.fmt(nm.fixed) : '') + ' ‹</small></button>';
    out += '<section class="tiles">' +
      tile('درهم', S.AED, 'AED', 'green') + tile('جنيه', S.EGP, 'EGP', 'green') + tile('دهب', S.GOLD, 'GOLD', 'gold') + '</section>';
    var mp = M.income > 0 ? Math.round(M.spent / M.income * 100) : 0;
    out += '<section class="card"><div class="row-head"><h3>' + MONTHS[new Date().getMonth()] + '</h3><button class="link" data-go="spend">التفاصيل ‹</button></div>' +
      '<div class="trio"><div><span>دخل</span>' + amt(M.income, 'AED', 'green') + '</div><div><span>صرفت</span>' + amt(M.spent, 'AED', 'red') + '</div><div><span>فاضل</span>' + amt(M.saved, 'AED', M.saved < 0 ? 'red' : '') + '</div></div>' +
      (M.income > 0 ? bar(mp, mp >= 90 ? 'var(--red)' : mp >= 70 ? 'var(--amber)' : 'var(--blue)') + '<p class="muted small">صرفت ' + mp + '% من دخل الشهر</p>' : '') + '</section>';
    out += '<section class="card"><div class="row-head"><h3>المواعيد الجاية</h3><span class="muted small">خلال 31 يوم</span></div>' +
      (ag.length ? '<ul class="agenda">' + (ui.agAll ? ag : ag.slice(0, 6)).map(agRow).join('') + '</ul>' +
        (ag.length > 6 ? '<button class="link more" data-act="ag-all">' + (ui.agAll ? 'عرض أقل' : 'عرض الكل (' + ag.length + ')') + '</button>' : '')

  function tile(label, v, cur, cls) { return '<button class="tile" data-go="savings"><span>' + label + '</span><b class="num ' + cls + '">' + Fin.fmt(v) + '</b><small>' + CURL[cur] + '</small></button>'; }
  function agRow(a) {

  }

  /* =================== مصاريفي =================== */
  function spendTab() {
    var hasEGP = L('tx').some(function (t) { return Fin.txCurrency(db(), t) === 'EGP' && Fin.isSpend(t); });
    if (!hasEGP) ui.cur = 'AED';
    var M = Fin.month(db(), ui.month, ui.cur), P = Fin.month(db(), Fin.prevKey(ui.month), ui.cur);
    var isNow = ui.month === today().slice(0, 7);

    if (isNow || ui.month > today().slice(0, 7)) out += advisorHTML();
    out += '<div class="monthnav"><button data-act="mprev" aria-label="الشهر اللي فات">›</button><b>' + mLabel(ui.month) + '</b><button data-act="mnext" aria-label="الشهر الجاي"' + (isNow ? ' disabled' : '') + '>‹</button></div>';
    if (hasEGP) out += '<div class="seg"><button data-cur="AED" aria-pressed="' + (ui.cur === 'AED') + '">درهم</button><button data-cur="EGP" aria-pressed="' + (ui.cur === 'EGP') + '">جنيه</button></div>';
    out += '<section class="card"><div class="trio"><div><span>دخل</span>' + amt(M.income, ui.cur, 'green') + '</div><div><span>صرفت</span>' + amt(M.spent, ui.cur, 'red') + '</div><div><span>فاضل</span>' + amt(M.saved, ui.cur, M.saved < 0 ? 'red' : '') + '</div></div></section>';

        var pv = P.byCat[c.id] || 0, diff = pv ? Math.round((c.amount / pv - 1) * 100) : null;
        return '<li><i style="background:' + catColor(c.id) + '"></i><span>' + esc(Fin.catName(db(), c.id)) + '</span><b class="num">' + Fin.fmt(c.amount) + '</b><em class="num">' + Math.round(c.amount / M.spent * 100) + '%</em>' +

  function advisorHTML() {

    var I = a.income, pc = function (n) { return Math.round(n / I * 100); };

      '<h4 class="sub-h">اقتراح تقسيم المتاح (' + Fin.fmt(a.available) + ')</h4><p class="muted small">الأرقام دي اقتراحات مش حدود. «خطتك» إنت اللي بتحددها؛ دوس على أي بند تغيّره.</p>' +

  function tips(a) {

      var fe = a.snowball.firstExtra;

  /* =================== النماذج =================== */
  var form = null;
  function openSheet(title, html, after) {
    $('#sheetTitle').textContent = title;
    var old = $('#sheetBody'), nb = old.cloneNode(false); // نسخة جديدة عشان مفيش listeners قديمة
    old.parentNode.replaceChild(nb, old);
    nb.innerHTML = html;
    $('#sheet').hidden = false;
    document.body.classList.add('noscroll');
    if (after) after($('#sheetBody'));
    var f = $('#sheetBody input:not([type=hidden]), #sheetBody select'); if (f && f.dataset.autofocus) f.focus();
  }
  function closeSheet() { $('#sheet').hidden = true; document.body.classList.remove('noscroll'); form = null; }

  function opt(v, l, sel) { return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(l) + '</option>'; }
  function accOptions(sel, cur, none) {
    var out = none ? opt('', none, !sel) : '';
    ['AED', 'EGP', 'GOLD'].forEach(function (c) {
      if (cur && cur.indexOf(c) < 0) return;
      var list = accounts(c); if (!list.length) return;
      out += '<optgroup label="' + { AED: 'درهم', EGP: 'جنيه', GOLD: 'دهب' }[c] + '">' + list.map(function (a) { return opt(a.id, a.name, a.id === sel); }).join('') + '</optgroup>';
    });
    return out;
  }
  // fields: [{id, label, type: amount|text|date|select|chips|seg|note|hidden|html, ...}]
  function openForm(spec) {
    form = spec;
    var html = '<form id="frm" class="frm" novalidate>' + spec.fields.map(fieldHTML).join('') +
      '<p class="err" id="ferr" aria-live="polite"></p>' +
      '<button class="btn" type="submit">' + (spec.submit || 'حفظ') + '</button>' +
      (spec.onDelete ? '<button class="btn danger" type="button" data-act="del">' + (spec.delLabel || 'حذف') + '</button>' : '') + '</form>';
    openSheet(spec.title, html, function (body) {
      var f = $('#frm', body);
      f.addEventListener('submit', function (e) { e.preventDefault(); submitForm(); });
      f.addEventListener('input', refreshForm); f.addEventListener('change', refreshForm);
      body.addEventListener('click', function (e) {
        var c = e.target.closest('[data-chip]');
        if (c) { var g = c.parentNode; $$('[data-chip]', g).forEach(function (x) { x.setAttribute('aria-pressed', String(x === c)); }); $('#f_' + g.dataset.for).value = c.dataset.chip; refreshForm(); }
        var d = e.target.closest('[data-act="del"]');
        if (d) { if (d.dataset.sure) { spec.onDelete(); closeSheet(); render(); toast('اتحذف'); } else { d.dataset.sure = '1'; d.textContent = 'متأكد؟ دوس تاني للحذف'; } }
      });
      refreshForm();
      var first = $('.f-amount input', body); if (first && !first.value) setTimeout(function () { first.focus(); }, 60);
    });
  }
  function fieldHTML(f) {
    var id = 'f_' + f.id, v = f.value == null ? '' : f.value;
    var wrap = function (inner) { return '<div class="field f-' + f.type + '" data-field="' + f.id + '">' + (f.label ? '<label for="' + id + '">' + f.label + '</label>' : '') + inner + (f.help ? '<small class="help">' + f.help + '</small>' : '') + '</div>'; };
    if (f.type === 'amount') return wrap('<div class="amount-in"><input id="' + id + '" inputmode="decimal" autocomplete="off" value="' + esc(v) + '" placeholder="0"><span>' + (f.unit || 'درهم') + '</span></div>');
    if (f.type === 'number') return wrap('<input id="' + id + '" inputmode="decimal" autocomplete="off" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '">');
    if (f.type === 'text') return wrap('<input id="' + id + '" type="text" autocomplete="off" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"' + (f.dir ? ' dir="' + f.dir + '"' : '') + '>');
    if (f.type === 'date') return wrap('<input id="' + id + '" type="date" value="' + esc(v || today()) + '">');
    if (f.type === 'select') return wrap('<select id="' + id + '">' + f.options + '</select>');
    if (f.type === 'chips') return wrap('<input type="hidden" id="' + id + '" value="' + esc(v) + '"><div class="chips" data-for="' + f.id + '">' + f.options.map(function (o) {
      return '<button type="button" data-chip="' + esc(o.v) + '" aria-pressed="' + (String(o.v) === String(v)) + '">' + (o.color ? '<i style="background:' + o.color + '"></i>' : '') + esc(o.l) + '</button>';
    }).join('') + '</div>');
    if (f.type === 'seg') return wrap('<input type="hidden" id="' + id + '" value="' + esc(v) + '"><div class="chips seg2" data-for="' + f.id + '">' + f.options.map(function (o) {
      return '<button type="button" data-chip="' + esc(o.v) + '" aria-pressed="' + (String(o.v) === String(v)) + '">' + esc(o.l) + '</button>';
    }).join('') + '</div>');
    if (f.type === 'html') return '<div class="field" data-field="' + f.id + '" id="' + id + '">' + (f.html || '') + '</div>';
    return '';
  }
  function values() {
    var v = {};
    form.fields.forEach(function (f) { var el = $('#f_' + f.id); if (el && 'value' in el) v[f.id] = el.value; });
    return v;
  }
  function refreshForm() {
    if (!form) return;
    var v = values();
    form.fields.forEach(function (f) { if (f.show) { var el = $('[data-field="' + f.id + '"]'); if (el) el.hidden = !f.show(v); } });
    if (form.preview) { var p = $('#f_preview'); if (p) p.innerHTML = form.preview(v) || ''; }
  }
  function submitForm() {

  }
  function need(n, msg) { return !(n > 0) ? (msg || 'اكتب المبلغ.') : ''; }

      validate: function (v) {
        if (kind === 'expense' && !v.cat) return 'اختار البند.';
        if (kind === 'transfer' && v.src === v.to) return 'اختار حسابين مختلفين.';
        if (kind === 'transfer' && curOf(v.src) !== curOf(v.to) && !(num(v.toAmount) > 0)) return 'اكتب المبلغ اللي وصل.';

          if (egyptCat && v.cat === egyptCat.id && num(v.egp) > 0 && v.egpAcc) { rec.egpAmount = num(v.egp); rec.egpAccountId = v.egpAcc; }
